name: Documentation site

# Builds site/ into static pages and publishes them with GitHub Pages. Needs Pages set to "GitHub Actions" in the
# repository settings (Settings, Pages, Source).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "demo/**"
      - "public/**"
      - "python/render_ops.py"
      - "packs/risa-dress/**"
      - "emotions.json"
      - "src/frame-pack.ts"
      - "docs/frame-packs.md"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run site
      # The browser demo goes in the site at demo/. It carries the character creator's Python files (the pinned release, as CI uses), which
      # Pyodide runs in the visitor's browser.
      # TODO(browser demo on the TypeScript): the app itself no longer needs Python, but the demo still does (demo/stage.mjs finds the
      # creator's Python package in `<creator>/src`, next to the `ts/src` folder CREATOR_SRC names). When the demo draws with the creator's
      # TypeScript, this staging changes with it: what is copied into demo/, the `python/render_ops.py` path filter above, and the CREATOR_SRC below.
      - id: creator
        run: echo "ref=$(node -p "require('./package.json').creator.ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: rhedak/anime-character-creator
          ref: ${{ steps.creator.outputs.ref }}
          path: creator
      - run: node demo/stage.mjs --out site/dist/demo
        env:
          CREATOR_SRC: ${{ github.workspace }}/creator/ts/src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
