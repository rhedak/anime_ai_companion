name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The creator sits next to this repo, as it does on a developer's machine.
      - uses: actions/checkout@v4
        with:
          path: anime_ai_companion
      # The pinned creator release (package.json), not whatever its default branch holds today.
      - id: creator
        run: echo "ref=$(node -p "require('./anime_ai_companion/package.json').creator.ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: rhedak/anime-character-creator
          ref: ${{ steps.creator.outputs.ref }}
          path: anime-character-creator
      # The oldest Node the project claims to support (engines in package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: anime_ai_companion
      # A lockfile that npm would rewrite makes a fresh clone look modified (the "you have local changes" nudge) after the first npm install.
      - run: npm install --package-lock-only --ignore-scripts && git diff --exit-code package-lock.json
        working-directory: anime_ai_companion
      - run: npm run typecheck
        working-directory: anime_ai_companion
      - run: npm test
        working-directory: anime_ai_companion
