name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The creator sits next to this repo, as it does on a developer's machine.
      - uses: actions/checkout@v4
        with:
          path: anime_ai_companion
      - uses: actions/checkout@v4
        with:
          repository: rhedak/anime-character-creator
          path: anime-character-creator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: anime_ai_companion
      - run: npm run typecheck
        working-directory: anime_ai_companion
      - run: npm test
        working-directory: anime_ai_companion
