<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack studio</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/custom.css"> <!-- your own tweaks: data/custom.css, see theme.css -->
  <style>
    /* The studio's panel, on its own page instead of over the stage. Same markup, same rules: only the layout changes. */
    html, body { height: 100%; margin: 0; }
    .studio-page { min-height: 100%; box-sizing: border-box; padding: 16px; position: relative; }
    .studio-page .studio { position: relative; top: auto; right: auto; max-height: none; overflow: visible; width: min(640px, 100%); margin: 0 auto; }
    .studio-page .studio-zoom { position: fixed; top: 16px; left: 16px; right: 16px; height: calc(100% - 32px); }
    .studio-page .studio-zoom.beside { right: auto; width: calc(100% - 32px); }
    .studio-page .pack-confirm { max-width: 640px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <main id="studio-host" class="studio-page"></main>
  <script type="module" src="studio-full.js"></script>
</body>
</html>
