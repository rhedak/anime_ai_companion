<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="stage">
      <div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
      <div class="tools">
        <button id="undo-look" class="ghost" title="Undo her last look change" disabled>Undo</button>
        <select id="looks" class="ghost" title="Your saved looks"><option value="">Looks…</option></select>
        <button id="save-look" class="ghost" title="Save the current look">Save look</button>
        <button id="voice" class="ghost" title="Let her read her replies aloud (uses your browser's own voices)" hidden>Voice: off</button>
        <button id="zoom" class="ghost" title="Switch between close-up and full body">Full body</button>
        <button id="reset-look" class="ghost" title="Restore the original look">Reset look</button>
      </div>
      <form id="save-look-form" class="save-form" hidden>
        <input id="look-name" maxlength="40" placeholder="Name this look" autocomplete="off">
        <button class="ghost">Save</button>
      </form>
      <div id="avatar" class="avatar" aria-label="Your companion"></div>
      <div id="bubble" class="bubble" hidden></div>
    </section>

    <section class="panel">
      <header>
        <h1>Mio</h1>
        <div class="seg-group" role="group" aria-label="Mode">
          <button id="mode-chat" class="seg on" title="Just chat: no tools">Chat</button>
          <button id="mode-work" class="seg" title="Let her work in a project folder; you approve each action">Work</button>
        </div>
        <button id="reset" class="ghost" title="Start a fresh conversation">New chat</button>
      </header>
      <div class="brainbar">
        <label>Brain
          <select id="provider" title="Which model powers her">
            <option value="claude">Claude Code</option>
            <option value="ollama">Ollama (local)</option>
          </select>
        </label>
        <select id="ollama-model" title="Installed Ollama models" hidden></select>
      </div>
      <div id="workbar" class="workbar" hidden>
        <div id="workrow" class="workrow">
          <input id="folder" type="text" placeholder="/path/to/your/project" spellcheck="false" autocomplete="off">
          <button id="folder-set" class="ghost">Work here</button>
        </div>
        <label id="permrow" class="permrow">Permissions
          <select id="permission-mode" title="How she handles approvals in work mode">
            <option value="manual">Ask for each action</option>
            <option value="plan">Plan first (no changes)</option>
            <option value="acceptEdits">Accept edits</option>
            <option value="auto">Auto (Claude decides)</option>
          </select>
        </label>
        <div id="workinfo" class="workinfo"></div>
      </div>
      <div id="log" class="log"></div>
      <div id="working" class="working" role="status" aria-live="polite" hidden>
        <span class="dots"><i></i><i></i><i></i></span>
        <span id="working-text"></span>
      </div>
      <div id="attachments" class="attachments" hidden></div>
      <form id="form">
        <button id="attach" type="button" class="ghost attach" title="Attach images (or paste or drop them)" aria-label="Attach images">📎</button>
        <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
        <textarea id="input" rows="1" placeholder="Say something… or ask her to change her look" autofocus></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <footer class="credit">
        Drawn by <a href="https://github.com/rhedak/anime-character-creator" target="_blank" rel="noopener">anime-character-creator</a>
        · <a href="https://github.com/rhedak/anime_ai_companion" target="_blank" rel="noopener">source</a>
      </footer>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
