<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companion</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/custom.css"> <!-- your own tweaks: data/custom.css, see theme.css -->
</head>
<body>
  <main>
    <section class="stage">
      <div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
      <div class="tools">
        <button id="undo-look" class="ghost" title="Undo her last look change" disabled>Undo</button>
        <select id="looks" class="ghost looks-pop" title="Change her look: your saved looks, presets and picture packs"><option value="">Looks…</option></select>
        <button id="save-look" class="ghost" title="Save the current look">Save look</button>
        <button id="voice" class="ghost" title="Let her read her replies aloud (uses your browser's own voices)" hidden>Voice: off</button>
        <select id="voice-pick" class="ghost" title="Which voice she speaks with. 'online' voices are made by a server, which receives the text" hidden></select>
        <select id="voice-rate" class="ghost" title="How fast she speaks" hidden></select>
        <button id="zoom" class="ghost" title="Switch between close-up and full body">Full body</button>
        <button id="reset-look" class="ghost" title="Restore the original look">Reset look</button>
        <button id="activity-stop" class="ghost" title="End the activity she is doing" hidden>End activity</button>
      </div>
      <div id="looks-hint" class="looks-hint" role="status" hidden>
        <span>Want a different look? Presets, your saved looks and picture packs are under <b>Looks…</b></span>
        <button id="looks-hint-close" class="ghost" aria-label="Dismiss">Got it</button>
      </div>
      <form id="save-look-form" class="save-form" hidden>
        <input id="look-name" maxlength="40" placeholder="Name this look" autocomplete="off">
        <button class="ghost">Save</button>
      </form>
      <div id="avatar" class="avatar" aria-label="Your companion"></div>
      <div id="bubble" class="bubble" hidden></div>
      <div id="pack-credit" class="pack-credit" hidden></div>
    </section>

    <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Resize the companion and chat panels" aria-valuemin="30" aria-valuemax="70" aria-valuenow="62" tabindex="0" title="Drag to resize (double-click to reset)"></div>

    <section class="panel">
      <header>
        <div class="name-row">
          <h1 id="name" class="name" tabindex="0" role="button" title="Click to rename">Risa</h1>
          <button id="name-reset" type="button" class="icon name-reset" hidden title="Forget this name and follow the character again" aria-label="Reset name">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5V9H9"/></svg>
          </button>
        </div>
        <div class="seg-group" role="group" aria-label="Mode">
          <button id="mode-chat" class="seg on" title="Just chat: no tools">Chat</button>
          <button id="mode-work" class="seg" title="Let her work in a project folder; you approve each action">Work</button>
        </div>
        <button id="view" type="button" class="icon" aria-pressed="false" title="Put her behind the chat" aria-label="Put her behind the chat">
          <svg class="view-split" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 12h16"/></svg>
          <svg class="view-behind" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="10" r="2.6"/><path d="M7.5 20c.4-3 2-4.6 4.5-4.6s4.1 1.600 4.500 4.600" stroke-linecap="round"/></svg>
        </button>
        <button id="reset" class="ghost" title="Start a fresh conversation">New chat</button>
      </header>
      <div id="workbar" class="workbar" hidden>
        <div id="worksummary" class="worksummary">
          <span id="worksummary-text" class="worksummary-text"></span>
          <button id="workbar-expand" type="button" class="icon small" aria-expanded="false" aria-controls="workbody" title="Show work settings" aria-label="Show work settings">+</button>
        </div>
        <div id="workbody" class="workbody">
        <div id="workrow" class="workrow">
          <input id="folder" type="text" placeholder="/path/to/your/project" spellcheck="false" autocomplete="off">
          <button id="folder-set" class="ghost">Work here</button>
          <button id="workbar-collapse" type="button" class="icon small" aria-expanded="true" aria-controls="workbody" title="Hide work settings" aria-label="Hide work settings">−</button>
        </div>
        <label id="setuprow" class="setuprow" title="Load your own Claude Code settings, hooks, rules and MCP servers, like in a terminal. Hooks run commands, so it is off until you turn it on.">
          <input type="checkbox" id="use-setup"> Use my Claude Code setup <span class="muted">(settings, hooks, MCP servers)</span><span class="computer-hint"> Set it on the computer.</span>
        </label>
        <label id="skillsrow" class="setuprow" title="Let her use your own skills (~/.claude/skills) by name. This loads your user settings, but not their hooks. A folder's own skills stay off unless you use your whole Claude Code setup. Off until you turn it on.">
          <input type="checkbox" id="use-skills"> Use my skills <span class="muted">(your user settings apply, hooks stay off)</span><span class="computer-hint"> Set it on the computer.</span>
        </label>
        <label id="chromerow" class="setuprow" title="Let her use your Chrome through the Claude in Chrome extension. The extension must already be installed and signed into the same Claude account. Browser actions use the same approvals as her other tools. Off until you turn it on, and off again when the server restarts.">
          <input type="checkbox" id="use-chrome"> Use my Chrome <span class="muted">(Claude in Chrome, same approvals as her other tools)</span><span class="computer-hint"> Set it on the computer.</span>
        </label>
        <div id="workinfo" class="workinfo"></div>
        </div>
      </div>
      <div id="log" class="log"></div>
      <div id="working" class="working" role="status" aria-live="polite" hidden>
        <span class="dots"><i></i><i></i><i></i></span>
        <span id="working-text"></span>
      </div>
      <div hidden>
        <select id="provider" title="Which model powers her">
          <option value="claude">Claude Code</option>
          <option value="cursor">Cursor</option>
          <option value="opencode">opencode</option>
          <option value="ollama">Ollama (local)</option>
          <option value="basic" hidden>No brain (built-in script)</option>
        </select>
        <select id="ollama-model" title="Installed Ollama models"></select>
        <select id="cursor-model" title="Models on your Cursor account"></select>
        <select id="opencode-model" title="Models available to opencode"></select>
        <select id="effort" title="How hard she thinks: more effort is slower and uses more of your limits">
          <option value="default">Default effort</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="xhigh">Extra high</option>
          <option value="max">Max</option>
        </select>
        <select id="permission-mode" title="How she handles approvals in work mode">
          <option value="manual">Ask for each action</option>
          <option value="plan">Plan first (no changes)</option>
          <option value="acceptEdits">Accept edits</option>
          <option value="auto">Auto (Claude decides)</option>
          <option value="everything" hidden>Run everything</option>
        </select>
      </div>
      <form id="form" class="composer">
        <div id="queue" class="queue" hidden aria-label="Messages waiting to be sent"></div>
        <div id="attachments" class="attachments" hidden></div>
        <div id="shell-hint" class="shell-hint" hidden>Shell command: runs in your project folder right away, nothing asks first</div>
        <textarea id="input" rows="1" placeholder="Say something… or ask her to change her look" autofocus></textarea>
        <div class="composer-bar">
          <button id="attach" type="button" class="icon attach" title="Attach images (or paste or drop them)" aria-label="Attach images">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="mic" type="button" class="icon mic" title="Speak instead of typing (your browser's speech recognition; it asks first)" aria-label="Speak instead of typing" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <div class="composer-right">
            <div id="menus" class="menus"></div>
          <button id="send" type="submit" class="icon send" title="Send" aria-label="Send">
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
          </button>
          </div>
        </div>
      </form>
      <div id="meter" class="meter" hidden></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
