[project]
name = "anime-ai-companion-pack-tools"
version = "0.1.0"
description = "Optional Python environment for the picture-pack tools (python/finish_pack.py, python/make_sample_pack.py). The app itself needs no Python."
requires-python = ">=3.11"
# Nothing to install: the tools get PIL, numpy and cairosvg per run (`uv run --with pillow --with numpy python python/finish_pack.py ...`,
# see docs/frame-packs.md). This file only pins which Python `uv run` picks (with .python-version). python/render_ops.py is not a tool: it
# is the frozen reference that scripts/gen-render-ops-fixtures.py runs to make the oracle for src/render-ops.ts.
dependencies = []

[tool.uv]
package = false
